<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .message {
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }

        .score-board {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h2>🎯 Number Guessing Game</h2>

        <input type="number" id="userGuess" placeholder="Enter a number (1–100)">
        <button onclick="checkGuess()">Submit Guess</button>

        <p class="message" id="message"></p>

        <div class="score-board">
            <p>Attempts Left: <span id="attemptsLeft">5</span></p>
            <p>Score: <span id="score">0</span></p>
            <p>Round: <span id="round">1</span> / 3</p>
        </div>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let maxAttempts = 5;
        let attempts = 0;
        let round = 1;
        let totalScore = 0;

        function checkGuess() {
            let guess = parseInt(document.getElementById("userGuess").value);
            let msg = document.getElementById("message");

            if (!guess || guess < 1 || guess > 100) {
                msg.innerHTML = "⚠ Enter a valid number (1–100)";
                msg.style.color = "red";
                return;
            }

            attempts++;

            if (guess === randomNumber) {
                let score = (maxAttempts - attempts + 1) * 10;
                totalScore += score;

                msg.innerHTML = "🎉 Correct! You scored " + score + " points!";
                msg.style.color = "green";

                nextRound();
                return;

            } else if (guess > randomNumber) {
                msg.innerHTML = "⬆ Too High!";
                msg.style.color = "blue";
            } else {
                msg.innerHTML = "⬇ Too Low!";
                msg.style.color = "orange";
            }

            document.getElementById("attemptsLeft").innerText = maxAttempts - attempts;

            if (attempts >= maxAttempts) {
                msg.innerHTML = "❌ No attempts left! Number was: " + randomNumber;
                msg.style.color = "red";
                nextRound();
            }
        }

        function nextRound() {
            setTimeout(() => {
                if (round === 3) {
                    alert("Game Over! Your Total Score: " + totalScore);
                    location.reload(); // restart game
                } else {
                    round++;
                    attempts = 0;
                    randomNumber = Math.floor(Math.random() * 100) + 1;

                    document.getElementById("round").innerText = round;
                    document.getElementById("attemptsLeft").innerText = maxAttempts;
                    document.getElementById("score").innerText = totalScore;
                    document.getElementById("message").innerHTML = "";
                }
            }, 1500);
        }
    </script>

</body>
</html>
